{% extends 'base.html' %}

{% block title %}
  Password Changed - Critiq
{% endblock %}

{% block content %}
  <div class="row mb-5">
    <div class="col-lg-6 mx-auto">
      <h1 class="mb-4">Password Changed</h1>

      <div class="card">
        <div class="card-body">
          <div class="alert alert-success mb-4">
            <i class="bi bi-check-circle me-2"></i> Your password was changed successfully!
          </div>

          <p>Your password has been updated. You can continue using the site with your new password.</p>

          <div class="d-grid mt-4">
            <a href="/" class="btn btn-primary">Return to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
