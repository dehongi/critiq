{% extends 'base.html' %}

{% block title %}
  Password Reset Complete - Critiq
{% endblock %}

{% block content %}
  <div class="row mb-5">
    <div class="col-lg-6 mx-auto">
      <h1 class="mb-4">Password Reset Complete</h1>

      <div class="card">
        <div class="card-body">
          <div class="alert alert-success mb-4">
            <i class="bi bi-check-circle me-2"></i> Your password has been set successfully!
          </div>

          <p>You can now use your new password to log in to your account.</p>

          <div class="d-grid mt-4">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
